[package]
name = "wqq-float"
version = "0.1.2"
description = "微趣趣线报网桌面悬浮通知"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["time", "macros", "rt-multi-thread"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = "0.36"
anyhow = "1"
# 新帖提示音：Rust 端解码播放 mp3（不走 WebView2，避开其 autoplay 限制
# 与 additionalBrowserArgs 影响设置窗渲染的副作用）
rodio = { version = "0.20", default-features = false, features = ["minimp3"] }

# 悬浮窗镂空（colorkey 抠图）：关 DWM blur + SetLayeredWindowAttributes
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
strip = true
lto = true
