<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>wqq-float</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
  <div id="hud">
    <div id="ball" data-tauri-drag-region title="拖动移动 · 单击打开论坛 · 右键菜单">
      <img src="assets/favicon.ico" alt="" draggable="false">
    </div>
    <div id="col">
      <div id="bar" title="单击打开帖子">
        <div id="ticker"><span id="title"></span></div>
        <span id="time"></span>
      </div>
      <div id="card">
        <h2 id="card-title"></h2>
        <div class="meta">
          <span id="card-author"></span> · <span id="card-forum"></span> ·
          <span id="card-time"></span> · 回复 <span id="card-replies"></span> · 浏览 <span id="card-views"></span>
        </div>
        <div class="summary" id="card-summary"></div>
      </div>
    </div>
  </div>

  <div id="menu" hidden>
    <div class="mi" data-act="forum">打开论坛</div>
    <div class="mi" data-act="settings">设置</div>
    <div class="mi danger" data-act="quit">退出</div>
  </div>

  <script src="app.js"></script>
</body>
</html>
